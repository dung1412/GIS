name: Python and deployment checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEBGIS_REQUIRE_AUTH: "1"
      WEBGIS_ENABLE_DEMO_ACCOUNTS: "0"
      WEBGIS_ALLOW_REGISTRATION: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run application security tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify native Linux service syntax
        run: python scripts/verify_service.py
